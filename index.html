<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>すぐ話せる中国語</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>すぐ話せる中国語</h1>
    <p class="subtitle">聞く → まねする → 話す。よく使うフレーズから覚えよう</p>
    <nav class="tabs">
      <button class="tab active" data-view="phrases">フレーズ</button>
      <button class="tab" data-view="quiz">クイズ</button>
      <button class="tab" data-view="tones">声調</button>
    </nav>
  </header>

  <main class="container">
    <div class="settings">
      <label>読み上げスピード
        <input type="range" id="rate" min="0.5" max="1.2" step="0.1" value="0.8">
        <span id="rate-value">0.8</span>
      </label>
      <span id="progress" class="progress"></span>
    </div>
    <p id="support-warning" class="warning" hidden></p>

    <!-- フレーズ -->
    <section id="view-phrases" class="view">
      <div id="categories" class="categories"></div>
      <div id="phrase-list" class="phrase-list"></div>
    </section>

    <!-- クイズ -->
    <section id="view-quiz" class="view" hidden>
      <div class="quiz-card">
        <p class="quiz-label">中国語でなんと言う？</p>
        <p id="quiz-question" class="quiz-question"></p>
        <div id="quiz-options" class="quiz-options"></div>
        <p id="quiz-result" class="quiz-result"></p>
        <div class="quiz-footer">
          <span id="quiz-score"></span>
          <button id="quiz-next" class="btn primary">次の問題</button>
        </div>
      </div>
    </section>

    <!-- 声調 -->
    <section id="view-tones" class="view" hidden>
      <p class="hint">中国語は音の高さ（声調）で意味が変わります。同じ「ma」でも4通り。押して聞き比べてみよう。</p>
      <div id="tone-list" class="tone-list"></div>
    </section>
  </main>

  <script src="data/phrases.js"></script>
  <script src="app.js"></script>
</body>
</html>
